name: Build and Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: Build native bridge (${{ matrix.platform_dir }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_dir: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            platform_dir: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            platform_dir: windows-x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify MSVC toolchain is discoverable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found; MSVC build tools may be missing on this runner image."
            exit 1
          }
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Install Linux build essentials
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git ca-certificates
          sudo update-ca-certificates

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Set aarch64 linker env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"

      - name: Set RUSTFLAGS for size and link optimization
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "RUSTFLAGS=-C link-arg=/OPT:REF -C link-arg=/OPT:ICF -C link-arg=/DEBUG:NONE" >> "$GITHUB_ENV"
          else
            echo "RUSTFLAGS=-C link-arg=-Wl,--gc-sections -C link-arg=-s" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/bridge/target
          key: cargo-${{ matrix.platform_dir }}-${{ hashFiles('native/bridge/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.platform_dir }}-

      - name: Clean vendor directory to force re-fetch with patches
        shell: bash
        run: |
          cd native/vendor/bc7enc_rdo
          rm -f rdo_bc_encoder.h rdo_bc_encoder.cpp \
                bc7enc.h bc7enc.cpp \
                ert.h ert.cpp \
                rgbcx.h rgbcx.cpp rgbcx_table4.h rgbcx_table4_small.h \
                utils.h utils.cpp \
                bc7decomp.h bc7decomp.cpp bc7decomp_ref.cpp \
                dds_defs.h \
                LICENSE

      - name: Fetch vendored bc7enc_rdo sources with patches
        shell: bash
        working-directory: native/vendor/bc7enc_rdo
        run: |
          chmod +x fetch.sh
          ./fetch.sh

      - name: cargo build --release
        shell: bash
        working-directory: native/bridge
        run: |
          cargo build --release --target ${{ matrix.target }}
          echo "==== contents of target/${{ matrix.target }}/release ===="
          ls -la target/${{ matrix.target }}/release || true

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staged-natives/natives/${{ matrix.platform_dir }}"
          BUILD_DIR="native/bridge/target/${{ matrix.target }}/release"
          echo "Looking for native library in $BUILD_DIR"
          ls -la "$BUILD_DIR" || true

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            LIB=$(find "$BUILD_DIR" -maxdepth 1 -type f -iname "tessera_bridge.dll" -o -iname "*.dll" | head -n1 || true)
          else
            LIB=$(find "$BUILD_DIR" -maxdepth 1 -type f \( -iname "libtessera_bridge.*" -o -iname "*.so" -o -iname "*.dylib" \) | head -n1 || true)
          fi

          if [ -z "$LIB" ]; then
            echo "::error::Could not find built native library in $BUILD_DIR"
            ls -la "$BUILD_DIR"
            exit 1
          fi

          echo "Found native library: $LIB"
          cp "$LIB" "staged-natives/natives/${{ matrix.platform_dir }}/$(basename "$LIB")"

      - name: Upload native artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.platform_dir }}
          path: staged-natives/natives/${{ matrix.platform_dir }}/*
          if-no-files-found: error

  package-jar:
    name: Package JAR with merged natives
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download all native artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: downloaded-natives

      - name: Merge natives into project resources
        run: |
          mkdir -p src/main/resources/assets/tessera/natives
          for dir in downloaded-natives/native-*; do
            platform_dir=$(basename "$dir" | sed 's/^native-//')
            mkdir -p "src/main/resources/assets/tessera/natives/$platform_dir"
            cp "$dir"/* "src/main/resources/assets/tessera/natives/$platform_dir/"
          done
          echo "Merged files:"
          find src/main/resources/assets/tessera/natives -type f

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndCollect -Ptessera.skipNativeBuild=true -Ptessera.fatJar=true --stacktrace

      - name: Verify JAR contains all natives
        run: |
          JAR_PATH=$(find build/libs -mindepth 2 -maxdepth 2 -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-dev.jar" | sort | head -n1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No candidate mod JAR found under build/libs/<version>/"
            find build/libs -type f
            exit 1
          fi
          echo "Inspecting $JAR_PATH"
          unzip -l "$JAR_PATH" | grep natives || true
          for plat in linux-x86_64 linux-aarch64 windows-x86_64; do
            if ! unzip -l "$JAR_PATH" | grep -q "natives/$plat/"; then
              echo "::error::Missing natives for $plat in $JAR_PATH"
              exit 1
            fi
          done

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: tessera-jar
          path: build/libs/**/*.jar
          if-no-files-found: error
